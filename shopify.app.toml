# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "f3e916cb5eae59b63a2ba87619664471"
application_url = "https://vedant-coin-reward.onrender.com"
embedded = true
name = "Vedant Image Mapper"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_files,read_orders,read_customers,read_products,read_payment_customizations,read_merchant_managed_fulfillment_orders,read_fulfillments,write_products,write_payment_customizations,write_app_proxy,write_discounts,write_discounts_allocator_functions"
optional_scopes = [ ]
use_legacy_install_flow = false
[product.metafields.app.demo_info]
type = "single_line_text_field"
name = "Demo Source Info"
description = "Tracks products created by the Shopify app template for development"

  [product.metafields.app.demo_info.access]
  admin = "merchant_read_write"

[metaobjects.app.example]
name = "Example"
description = "An example metaobject definition created by this template"

  [metaobjects.app.example.access]
  admin = "merchant_read_write"

[metaobjects.app.example.fields.title]
name = "Title"
type = "single_line_text_field"
required = true

[metaobjects.app.example.fields.description]
name = "Description"
type = "multi_line_text_field"

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/orders/create"
  topics = [ "orders/create" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/orders/paid"
  topics = [ "orders/paid" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/fulfillments/create"
  topics = [ "fulfillments/create" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/fulfillments/update"
  topics = [ "fulfillments/update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/orders/fulfilled"
  topics = [ "orders/fulfilled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/fulfillment_orders/cancelled"
  topics = [ "fulfillment_orders/cancelled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/orders/cancelled"
  topics = [ "orders/cancelled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/refunds/create"
  topics = [ "refunds/create" ]

[auth]
redirect_urls = [ ]

[payment_customization.metafields.app.payment-customization-function-configuration]
type = "json"
name = "Payment Mode Configuration"
description = "Controls whether customers can pay online or by Cash on Delivery."

  [payment_customization.metafields.app.payment-customization-function-configuration.access]
  admin = "merchant_read_write"

[build]
automatically_update_urls_on_dev = true

[app_proxy]
url = "/app-proxy"
prefix = "apps"
subpath = "coins"
