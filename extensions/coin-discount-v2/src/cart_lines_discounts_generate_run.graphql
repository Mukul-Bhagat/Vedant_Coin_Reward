query CartInput {
  cart {
    attribute(key: "_vedant_coin_discount") {
      key
      value
    }
    cost {
      subtotalAmount {
        amount
      }
    }
    lines {
      id
      cost {
        subtotalAmount {
          amount
        }
      }
    }
  }
  discount {
    discountClasses
  }
}
